# Meta配置模板：https://github.com/MetaCubeX/mihomo/blob/Alpha/docs/config.yaml
# 接管：部分参数不支持在此页面直接修改，请到覆写设置页面进行修改
# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
udp: true
find-process-mode: off

# 统一测速延迟计算
unified-delay: true

# 多 IP 并发连接，优先使用最先成功的 IP
tcp-concurrent: true

profile:
  # 保存策略组选择结果
  store-selected: true

  # 保存 fake-ip 映射
  store-fake-ip: true


# ============================================================
# DNS
# ============================================================

dns:
  enable: true

  # ARC 缓存算法
  cache-algorithm: arc

  # 当前家庭网络不使用 IPv6
  ipv6: false

  # Fake-IP
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # OpenClash DNS Hijack 端口
  listen: 0.0.0.0:7874
  # 配置后面的nameserver、fallback和nameserver-policy向dns服务器的连接过程是否遵守rules规则
  respect-rules: true
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # 本地域名不要 Fake-IP
    - "*.lan"
    - "*.local"
    - rule-set:fakeip-filter

  # ==========================================================
  # DNS 分流
  # ==========================================================
  nameserver-policy:
    # 中国大陆 / Private / Apple
    "geosite:cn,private,apple":
      - 218.85.152.99
      - 218.85.157.99
    "geosite:category-ads-all": rcode://success # DNS 层面的广告域名拦截  

  # 直连与基础解析 DNS（使用精准的国内加密 DNS 避免直连被阻断）
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query

  use-hosts: true

  # 解析其他 DNS 服务器域名的基础 DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 专用于节点域名解析的 DNS 服务器
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29


# ============================================================
# 域名嗅探 (Sniffer)
# ============================================================

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443

  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"

  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.tailscale.com"
    - "+.ts.net"


# ============================================================
# 机场节点订阅
# ============================================================

proxy-providers:

  airport:
    # 实际地址由 OpenClash Overwrite 注入
    url: "机场地址"

    type: http

    # 订阅每天更新一次
    interval: 86400

    # 订阅本身通过直连更新
    proxy: 直连

    health-check:
      enable: true

      url: https://www.gstatic.com/generate_204

      # 5 分钟检查一次
      interval: 300

      # 5 秒超时
      timeout: 5000

      # 当前未使用的 Provider 不主动测速
      lazy: true

      # gstatic 204 检测
      expected-status: 204


# ============================================================
# 基础代理
# ============================================================

proxies:

  - {name: 直连, type: direct}

  - {name: 拒绝, type: reject}


# ============================================================
# 默认业务策略组模板
# ============================================================

default: &default
  type: select
  proxies:
    - 自动选择
    - 全部节点
    - 香港
    - 香港自动
    - 日本
    - 日本自动
    - 新加坡
    - 新加坡自动
    - 美国
    - 美国自动
    - 台湾
    - 台湾自动
    - 其他地区
    - 直连


# ============================================================
# 业务策略组
# ============================================================

proxy-groups:
  - {name: 人工智能, <<: *default}
  - {name: YouTube, <<: *default}
  - {name: 影视刮削, <<: *default}
  - {name: 流媒体, <<: *default}
  - {name: 谷歌, <<: *default}
  - {name: 微软, <<: *default}
  - name: 苹果
    type: select
    proxies:
      - 直连
      - 国外
  - {name: 英伟达, <<: *default}
  - {name: 游戏, <<: *default}
  - {name: 加密货币, <<: *default}
  - {name: 颜色, <<: *default}
  - {name: 测试, <<: *default}
  - {name: 国外, <<: *default}
  - name: 国内
    type: select
    proxies:
      - 直连
      - 国外
  - {name: 漏网之鱼, <<: *default}

  # ==========================
  # 基础节点
  # ==========================

  - name: 全部节点
    type: select
    include-all-providers: true

  - name: 自动选择
    type: url-test
    include-all-providers: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30

  # ==========================
  # 地区
  # ==========================

  - name: 香港
    type: select
    include-all-providers: true
    filter: "(?i)港|hk|hong ?kong"

  - name: 香港自动
    type: url-test
    include-all-providers: true
    filter: "(?i)港|hk|hong ?kong"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30

  - name: 日本
    type: select
    include-all-providers: true
    filter: "(?i)日|jp|japan"

  - name: 日本自动
    type: url-test
    include-all-providers: true
    filter: "(?i)日|jp|japan"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30

  - name: 新加坡
    type: select
    include-all-providers: true
    filter: "(?i)新|sg|singapore"

  - name: 新加坡自动
    type: url-test
    include-all-providers: true
    filter: "(?i)新|sg|singapore"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30

  - name: 美国
    type: select
    include-all-providers: true
    filter: "(?i)美|us|united ?states"

  - name: 美国自动
    type: url-test
    include-all-providers: true
    filter: "(?i)美|us|united ?states"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30

  - name: 台湾
    type: select
    include-all-providers: true
    filter: "(?i)台|tw|taiwan"

  - name: 台湾自动
    type: url-test
    include-all-providers: true
    filter: "(?i)台|tw|taiwan"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30

  - name: 其他地区
    type: select
    include-all-providers: true
    exclude-filter: "(?i)港|hk|hong ?kong|台|tw|taiwan|日|jp|japan|新|sg|singapore|美|us|united ?states"


# ============================================================
# Rules
# ============================================================

rules:

  # ==========================================================
  # 1. 广告 / 拒绝
  # ==========================================================

  - RULE-SET,Loyalsoldier / Reject,REJECT


  # ==========================================================
  # 2. LAN / 本地 / 私有域名（提至前置，避免内网穿透走代理）
  # ==========================================================

  - GEOIP,LAN,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - RULE-SET,Private / Domain,国内


  # ==========================================================
  # 3. Apple 基础设施
  # ==========================================================

  - DOMAIN,time.apple.com,DIRECT
  - DOMAIN,time.asia.apple.com,DIRECT
  - DOMAIN,push.apple.com,DIRECT
  - DOMAIN,courier.push.apple.com,DIRECT
  - DOMAIN,pushex.apple.com,DIRECT


